name: Rebuild site (docs/)

# GitHub Pages serves the static export committed in docs/.
# After every merge to main, rebuild it so the live site matches the code.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-docs
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - name: Commit the rebuilt site if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then
            echo "docs/ is already up to date"
          else
            git commit -m "chore: rebuild docs/ for GitHub Pages"
            git push
          fi
